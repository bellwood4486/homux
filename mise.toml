# homux の開発ツールチェーン。
# clone 後は `mise install` だけで品質ゲートが再現する。
#
# バージョンはすべて明示的に固定する。エージェントが lint 失敗に遭遇したとき、
# それが自分のコードのせいかツールの更新のせいかを切り分けられなくなるため。

[tools]
go = "1.27.1"
just = "1.58.0"
golangci-lint = "2.13.2"
goreleaser = "2.18.0"
lefthook = "2.1.12"

[settings]
# .mise.toml を持つディレクトリに入ったとき、未インストールのツールを自動で入れない。
# 明示的な `mise install` を経路として一本化する。
auto_install = false
